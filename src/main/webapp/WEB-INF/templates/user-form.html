<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма пользователя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #444;
            font-size: 15px;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(102, 126, 234, 0.4);
        }

        a.cancel {
            color: #888;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            padding: 8px 16px;
            transition: color 0.3s;
        }

        a.cancel:hover {
            color: #333;
            text-decoration: underline;
        }

        .note {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1 th:text="${user.id == null} ? 'Добавление пользователя' : 'Редактирование пользователя'"></h1>

    <form th:action="${user.id == null} ? @{/users} : @{/users/update}"
          th:object="${user}" method="post" accept-charset="UTF-8">
        <input type="hidden" th:field="*{id}" th:if="${user.id != null}" />

        <label>Имя</label>
        <input type="text" th:field="*{name}" required placeholder="Введите имя" />

        <label>Email</label>
        <input type="email" th:field="*{email}" required placeholder="Введите email" />

        <div class="buttons">
            <a th:href="@{/users}" class="cancel">Отмена</a>
            <button type="submit">Сохранить</button>
        </div>
    </form>
    <div class="note">Поля обязательны для заполнения</div>
</div>
</body>
</html>
