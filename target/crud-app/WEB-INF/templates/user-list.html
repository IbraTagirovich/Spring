<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 40px 35px;
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .add-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }
        .add-btn:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(102, 126, 234, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        thead {
            background: #667eea;
            color: white;
        }
        th {
            padding: 15px 12px;
            font-weight: 600;
            text-align: left;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        td {
            padding: 12px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover {
            background-color: #f8f9ff;
            transition: background 0.2s;
        }
        .actions a {
            display: inline-block;
            margin-right: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 5px 12px;
            border-radius: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .actions .edit {
            background: #e8f0fe;
            color: #667eea;
        }
        .actions .edit:hover {
            background: #667eea;
            color: white;
        }
        .actions .delete {
            background: #ffeaea;
            color: #e74c3c;
        }
        .actions .delete:hover {
            background: #e74c3c;
            color: white;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Все пользователи</h1>
    <a th:href="@{/users/new}" class="add-btn">Добавить нового пользователя</a>

    <table th:if="${not #lists.isEmpty(users)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.name}">Иван</td>
            <td th:text="${user.email}">ivan@mail.com</td>
            <td class="actions">
                <a th:href="@{/users/edit/{id}(id=${user.id})}" class="edit">Редактировать</a>
                <a th:href="@{/users/delete/{id}(id=${user.id})}"
                   onclick="return confirm('Удалить пользователя?')" class="delete">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(users)}" class="empty">
        Пользователей пока нет. Добавьте первого!
    </div>
</div>
</body>
</html>
